<script>
/* ==========================================
   ALPHA ONE — SUPABASE CONNECTION
========================================== */

const SUPABASE_URL = 'https://jrupwyaggntgsulpaqyq.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_JoplUxXVcfBfb2dDltRyaQ_qk6b01jy';

const alphaClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    db: {
      schema: 'alpha'
    },
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* ==========================================
   NAVIGATION
========================================== */

function navigate(page, element) {

  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });

  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
  });

  const target = document.getElementById(page);

  if (target) target.classList.add('active');

  if (element) {
    element.classList.add('active');
  } else {
    document.querySelectorAll('.nav-item').forEach(n => {
      if (n.getAttribute('onclick')?.includes("'" + page + "'")) {
        n.classList.add('active');
      }
    });
  }

  document.getElementById('sidebar').classList.remove('open');
}


function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}


/* ==========================================
   SYSTEM STATUS
========================================== */

function updateStatus(message, color) {

  const status = document.querySelector('.status');

  status.textContent = message;
  status.style.color = color;

  status.style.setProperty('--status-color', color);
}


/* ==========================================
   AUTHENTICATION
========================================== */

async function signUp() {

  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;

  const message = document.getElementById('authMessage');

  if (!email || !password) {
    message.textContent = 'Enter your email and password.';
    return;
  }

  if (password.length < 6) {
    message.textContent = 'Password must contain at least 6 characters.';
    return;
  }

  message.textContent = 'Creating your Alpha One account...';

  try {

    const { data, error } = await alphaClient.auth.signUp({
      email,
      password
    });

    if (error) throw error;

    if (data.session) {
      message.textContent = 'Account created. You are now signed in.';
    } else {
      message.textContent =
        'Account created. Check your email for a verification link before signing in.';
    }

  } catch (error) {

    message.textContent = 'Registration failed: ' + error.message;

  }
}


async function signIn() {

  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;

  const message = document.getElementById('authMessage');

  if (!email || !password) {
    message.textContent = 'Enter your email and password.';
    return;
  }

  message.textContent = 'Signing in...';

  try {

    const { data, error } = await alphaClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    message.textContent = 'Welcome. You are signed in to Alpha One.';

    await checkAlphaAccess();

  } catch (error) {

    message.textContent = 'Sign-in failed: ' + error.message;

  }
}


async function signOut() {

  const message = document.getElementById('authMessage');

  const { error } = await alphaClient.auth.signOut();

  if (error) {
    message.textContent = 'Sign-out failed: ' + error.message;
    return;
  }

  message.textContent = 'You have signed out.';

  updateStatus('Authentication required', '#b7791f');

}


/* ==========================================
   VERIFY ALPHA DATABASE ACCESS
========================================== */

async function checkAlphaAccess() {

  const message = document.getElementById('authMessage');

  try {

    const { data: sessionData, error: sessionError } =
      await alphaClient.auth.getSession();

    if (sessionError) throw sessionError;

    const session = sessionData.session;

    if (!session) {

      updateStatus('Authentication required', '#b7791f');

      message.textContent =
        'Sign in to access your private Alpha One workspace.';

      return;
    }

    updateStatus('Checking Alpha database...', '#3769ed');

    const { error } = await alphaClient
      .from('alpha_settings')
      .select('id')
      .limit(1);

    if (error) throw error;

    updateStatus('Alpha database connected', '#159b68');

    message.textContent =
      'Authenticated as ' + session.user.email +
      '. Alpha database access verified.';

    console.log('Alpha One database connection successful.');

  } catch (error) {

    updateStatus('Database connection error', '#d64545');

    message.textContent =
      'Database access error: ' + error.message;

    console.error('Alpha One:', error);

  }
}


/* ==========================================
   AUTHENTICATION STATE LISTENER
========================================== */

alphaClient.auth.onAuthStateChange((event, session) => {

  if (session) {

    updateStatus('Authenticated', '#159b68');

    document.getElementById('authMessage').textContent =
      'Signed in as ' + session.user.email;

  } else {

    updateStatus('Authentication required', '#b7791f');

  }

});


/* ==========================================
   CHAT INTERFACE
========================================== */

function sendMessage() {

  const input = document.getElementById('chatInput');
  const messages = document.getElementById('messages');

  const value = input.value.trim();

  if (!value) return;

  const userMessage = document.createElement('div');

  userMessage.className = 'message user';
  userMessage.textContent = value;

  messages.appendChild(userMessage);

  const response = document.createElement('div');

  response.className = 'message ai';

  response.textContent =
    'Your message has been received. Alpha One is connected to its authentication and database infrastructure. The AI intelligence engine is not yet connected.';

  messages.appendChild(response);

  input.value = '';

  messages.scrollTop = messages.scrollHeight;

}


/* ==========================================
   INITIALISE ALPHA ONE
========================================== */

async function initialiseAlphaOne() {

  updateStatus('Connecting to Alpha One...', '#3769ed');

  await checkAlphaAccess();

  console.log('Alpha One interface initialised.');

}

initialiseAlphaOne();

</script>
